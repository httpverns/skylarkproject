<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skylark ARPG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      overflow: hidden;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #001a00 0%, #003300 100%);
    }

    #game-header {
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid #0f0;
      font-size: 14px;
      text-shadow: 0 0 10px #0f0;
    }

    #game-canvas {
      flex: 1;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #0f0;
    }

    #game-hud {
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.8);
      border-top: 2px solid #0f0;
      font-size: 12px;
      display: flex;
      gap: 30px;
      justify-content: space-between;
    }

    .hud-section {
      flex: 1;
    }

    .hud-label {
      color: #0f0;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .hud-value {
      color: #00ff00;
      font-size: 11px;
    }

    .hud-hint {
      color: #0f0;
      font-size: 10px;
      margin-top: 20px;
      opacity: 0.7;
    }

    .loading {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game-header">
      <strong>SKYLARK ARPG v0.2.0</strong> - Phase 2: NPCs & Dialogue
    </div>

    <div id="game-canvas">
      <div class="loading">Initializing game engine...</div>
    </div>

    <div id="game-hud">
      <div class="hud-section">
        <div class="hud-label">STATUS</div>
        <div class="hud-value" id="status-text">Loading...</div>
      </div>
      <div class="hud-section">
        <div class="hud-label">POSITION</div>
        <div class="hud-value" id="position-text">-- , --</div>
      </div>
      <div class="hud-section">
        <div class="hud-label">FPS</div>
        <div class="hud-value" id="fps-text">-- fps</div>
      </div>
      <div class="hud-section">
        <div class="hud-hint">
          <strong>CONTROLS:</strong><br>
          WASD/Arrows: Move<br>
          E: Interact | ESC: Cancel
        </div>
      </div>
    </div>
  </div>

  <script src="js/game.js" type="module"></script>
</body>
</html>
